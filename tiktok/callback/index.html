<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexão TikTok | The Watermouse</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--sage:#4A7C6F;--ink:#1C2B26;--off-white:#FAF8F5;--pale:#FBF5ED;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'DM Sans',sans-serif;background:var(--off-white);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;}
  .card{max-width:560px;width:100%;background:#fff;border:1px solid rgba(28,43,38,0.08);border-radius:16px;padding:32px 28px;}
  h1{font-family:'Fraunces',serif;font-weight:300;font-size:28px;margin-bottom:10px;}
  p{font-weight:300;color:rgba(28,43,38,0.8);line-height:1.6;margin-bottom:14px;font-size:15px;}
  .code{font-family:ui-monospace,Consolas,monospace;font-size:13px;background:var(--pale);border:1px solid rgba(196,168,130,0.35);border-radius:10px;padding:12px;word-break:break-all;margin-bottom:14px;}
  button{font:inherit;font-weight:500;background:var(--sage);color:#fff;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;}
  .err{color:#9B2C2C;}
  .small{font-size:12px;color:rgba(28,43,38,0.5);}
</style>
</head>
<body>
<div class="card">
  <h1 id="t">Conexão com o TikTok</h1>
  <div id="out"><p>Lendo a resposta do TikTok…</p></div>
  <p class="small">Watermouse Insights · ferramenta interna de análise. <a href="/privacidade/">Privacidade</a> · <a href="/termos/">Termos</a></p>
</div>
<script>
  (function(){
    var q = new URLSearchParams(location.search), out = document.getElementById('out');
    var code = q.get('code'), err = q.get('error'), desc = q.get('error_description');
    function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
    if (code) {
      var payload = location.href;
      out.innerHTML = '<p>Autorização concedida. Copie o link abaixo e cole no terminal do Watermouse Insights para concluir a conexão.</p>' +
        '<div class="code" id="c">' + esc(payload) + '</div>' +
        '<button id="b">Copiar</button>';
      document.getElementById('b').onclick = function(){
        navigator.clipboard.writeText(payload).then(function(){ document.getElementById('b').textContent = 'Copiado ✓'; });
      };
    } else if (err) {
      out.innerHTML = '<p class="err">O TikTok retornou um erro: <strong>' + esc(err) + '</strong></p>' + (desc ? '<p>' + esc(desc) + '</p>' : '');
    } else {
      out.innerHTML = '<p>Esta página recebe a autorização do TikTok para o Watermouse Insights. Nenhum código foi encontrado no endereço.</p>';
    }
  })();
</script>
</body>
</html>
